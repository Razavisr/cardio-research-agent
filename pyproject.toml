[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cardio-research-agent"
version = "0.1.0"
description = "A governed cardiology cohort-discovery and chart-abstraction workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-huggingface>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "torch>=2.5,<3.0",
    "transformers>=4.48,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cardio_research_agent"]